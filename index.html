<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GPTChat</title>
<style>
:root{--bg:#ffffff;--side:#f4f5f7;--ink:#1f2328;--mute:#6b7280;--line:#e5e7eb;--brand:#10a37f;--user:#eef2f6;--code:#0f172a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#212327;--side:#17181b;--ink:#ececf1;--mute:#9ca3af;--line:#33363c;--user:#2c2f35;--code:#0b0c0e}}
:root[data-theme="dark"]{--bg:#212327;--side:#17181b;--ink:#ececf1;--mute:#9ca3af;--line:#33363c;--user:#2c2f35;--code:#0b0c0e}
*{box-sizing:border-box}html,body{height:100%;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
button,textarea{font:inherit;color:var(--ink)}
.app{display:flex;height:100%}
aside{width:270px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px;gap:8px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.15rem;padding:4px 6px 8px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:.8rem}
.new{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;font-weight:600}
.new:hover,.ch:hover{border-color:var(--brand)}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:9px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent;font-size:.92rem}
.ch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ch.on{background:var(--bg);border-color:var(--line)}
.ch button{background:none;border:0;cursor:pointer;color:var(--mute);padding:2px 6px;border-radius:6px}.ch button:hover{color:#dc2626}
main{flex:1;display:flex;flex-direction:column;min-width:0}
.bar{display:none;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.bar button{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
#msgs{flex:1;overflow:auto;padding:20px 14px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:12px}.row.u{justify-content:flex-end}
.av{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:.75rem;font-weight:700;flex-shrink:0}
.b{line-height:1.65;min-width:0;overflow-wrap:anywhere}.row.u .b{background:var(--user);padding:10px 14px;border-radius:16px;max-width:80%}
.b pre{background:var(--code);color:#e5e7eb;padding:12px;border-radius:10px;overflow-x:auto;margin:8px 0;font-size:.85rem}
.b code{font-family:Consolas,Menlo,monospace}.b :not(pre)>code{background:var(--user);padding:1px 6px;border-radius:5px;font-size:.88em}
.cp{background:none;border:0;color:var(--mute);cursor:pointer;font-size:.78rem;padding:2px 0;margin-top:4px}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--mute);animation:bl 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.empty{text-align:center;padding-top:9vh}.empty h1{font-size:2rem;margin:0 0 6px}.empty p{color:var(--mute);margin:0 0 22px}
.sug{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;margin:0 auto}
.sug button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;cursor:pointer;text-align:left;font-size:.9rem}.sug button:hover{border-color:var(--brand)}
.comp{padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.box{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line);border-radius:18px;padding:8px 8px 8px 14px;background:var(--bg)}
.box:focus-within{border-color:var(--brand)}
textarea{flex:1;border:0;outline:0;background:none;resize:none;max-height:180px;line-height:1.5;padding:6px 0}
#go{width:38px;height:38px;border-radius:50%;border:0;background:var(--brand);color:#fff;cursor:pointer;font-size:1.1rem}
#go:disabled{opacity:.4;cursor:default}.note{text-align:center;color:var(--mute);font-size:.74rem;margin-top:6px}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
@media(max-width:760px){
 aside{position:fixed;top:0;bottom:0;left:0;z-index:10;transform:translateX(-100%);transition:transform .2s;padding-top:calc(12px + env(safe-area-inset-top,0px))}
 aside.open{transform:none}.bar{display:flex}.sug{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.gen{max-width:100%;width:420px;border-radius:14px;display:block;background:var(--user);min-height:120px}.dl{font-size:.8rem;color:var(--mute)}.tg{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;font-size:1.05rem}.tg.on{background:var(--brand);border-color:var(--brand)}
</style>
</head>
<body>
<div class="app">
<aside id="side">
  <div class="brand"><span class="logo">G</span>GPTChat</div>
  <button class="new" id="new">+ New chat</button>
  <button class="new" id="key">🔑 API key</button>
  <div id="list"></div>
</aside>
<main>
  <div class="bar"><button id="menu" aria-label="Open chats">☰</button><b>GPTChat</b></div>
  <div id="msgs"><div class="wrap" id="wrap"></div></div>
  <div class="comp">
    <div class="box"><button class="tg" id="img" title="Image mode" aria-label="Image mode">🎨</button><textarea id="in" rows="1" placeholder="Kuch bhi poochho... (image ke liye 🎨 dabao)"></textarea><button id="go" aria-label="Send">➤</button></div>
    <div class="note">AI galti kar sakta hai. Zaroori baatein dobara check karo.</div>
  </div>
</main>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const store=()=>{try{localStorage.setItem("gc-chats",JSON.stringify(chats))}catch(e){}};
let chats=load("gc-chats",[]),cur=null,busy=false,ctrl=null,sp=null;
const SYS="You are GPTChat, a friendly and helpful assistant. Reply in the same language the user writes in (Hindi, Hinglish or English). Be clear and concise. Use short paragraphs and code blocks when useful.";
const SUG=["Python mein ek calculator banao","Mujhe 5 din ka study plan do","Email likhne mein help karo","/image sunset mein ek chhota ghar"];
function fmt(t){return t.split("```").map((p,i)=>{
  if(i%2){const nl=p.indexOf("\n");const code=nl>-1?p.slice(nl+1):p;return "<pre><code>"+esc(code.replace(/\n$/,""))+"</code></pre>"}
  return esc(p).replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>")}).join("")}
const curChat=()=>chats.find(c=>c.id===cur);
function msgHTML(m,i){return m.role==="user"
  ?`<div class="row u"><div class="b">${esc(m.content).replace(/\n/g,"<br>")}</div></div>`
  :`<div class="row"><div class="av">G</div><div><div class="b">${m.img?imgHTML(m):m.content?fmt(m.content):'<div class="dots"><span></span><span></span><span></span></div>'}</div>${m.content&&!(busy&&i===curChat().m.length-1)?`<button class="cp" data-c="${i}">Copy</button>`:""}</div></div>`}
function render(){
  const c=curChat();
  $("wrap").innerHTML=c&&c.m.length?c.m.map(msgHTML).join(""):`<div class="empty"><h1>GPTChat</h1><p>Aaj main tumhari kya madad karun?</p><div class="sug">${SUG.map(s=>`<button data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div></div>`;
  $("list").innerHTML=chats.map(x=>`<div class="ch ${x.id===cur?"on":""}" data-id="${x.id}"><span>${esc(x.t)}</span><button data-del="${x.id}" aria-label="Delete chat">✕</button></div>`).join("");
  $("msgs").scrollTop=$("msgs").scrollHeight;$("go").disabled=false;$("go").textContent=busy?"■":"➤";
}
function paint(a){const rows=$("wrap").children;const b=rows[rows.length-1].querySelector(".b");b.innerHTML=a.content?fmt(a.content):b.innerHTML;$("msgs").scrollTop=$("msgs").scrollHeight}
const IMG=/^\/(image|img)\s+/i;let imgMode=false;
function imgHTML(m){return `<img class="gen" src="${esc(m.img)}" alt="${esc(m.alt||"image")}" onerror="this.outerHTML='<p>Image nahi ban payi. Thodi der baad try karo.</p>'"><a class="dl" href="${esc(m.img)}" download="gptchat.jpg">Download</a>`}
async function send(text){
  text=text.trim();if(!text||busy)return;
  const isImg=imgMode||IMG.test(text),prompt=text.replace(IMG,"");
  let c=curChat();if(!c){c={id:Date.now()+"",t:text.slice(0,38),m:[]};chats.unshift(c);cur=c.id}
  c.m.push({role:"user",content:text});
  const a={role:"assistant",content:"",img:isImg?"https://image.pollinations.ai/prompt/"+encodeURIComponent(prompt)+"?width=768&height=768&nologo=true&seed="+Date.now():null,alt:prompt};c.m.push(a);
  $("in").value="";$("in").style.height="auto";
  if(isImg){store();render();return}
  busy=true;render();
  try{
    const msgs=c.m.slice(0,-1).slice(-19).filter(m=>m.content).map(m=>({role:m.role,content:m.content}));
    let k="";try{k=localStorage.getItem("gc-gkey")||""}catch(x){}
    if(!k){a.content="Pehle left side ke 🔑 button se apni Gemini API key daalo."}
    else{
      const cts=[];
      msgs.forEach(m=>{const r=m.role==="user"?"user":"model",l=cts[cts.length-1];
        if(l&&l.role===r)l.parts[0].text+="\n\n"+m.content;else cts.push({role:r,parts:[{text:m.content}]})});
      ctrl=new AbortController();let out="",err="";
      for(const mo of ["gemini-3.5-flash","gemini-flash-latest"]){
        const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+mo+":generateContent",{method:"POST",headers:{"content-type":"application/json","x-goog-api-key":k},body:JSON.stringify({systemInstruction:{parts:[{text:SYS}]},contents:cts}),signal:ctrl.signal});
        const d=await r.json();
        if(r.ok){out=((d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[]).map(p=>p.text||"").join("");err="";break}
        err=(d.error&&d.error.message)||"Kuch gadbad ho gayi.";if(r.status!==404)break;
      }
      a.content=out||err||"Koi jawab nahi aaya. Dobara try karo.";
    }
  }catch(e){a.content=e.name==="AbortError"?"(Roka gaya)":"Connect nahi ho paya. Internet ya Gemini key check karo."}
  busy=false;ctrl=null;store();render();
}
$("key").onclick=()=>{const v=prompt("Gemini API key paste karo (aistudio.google.com se free milti hai). Ye sirf tumhare browser mein save hogi:");if(v){try{localStorage.setItem("gc-gkey",v.trim())}catch(e){}alert("Key save ho gayi.")}};
$("img").onclick=()=>{imgMode=!imgMode;$("img").classList.toggle("on",imgMode);$("in").placeholder=imgMode?"Image ka description likho...":"Kuch bhi poochho..."};
$("go").onclick=()=>{if(busy&&ctrl)ctrl.abort();else send($("in").value)};
$("in").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send($("in").value)}};
$("in").oninput=e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,180)+"px"};
$("new").onclick=()=>{if(busy)return;cur=null;render();$("side").classList.remove("open");$("in").focus()};
$("menu").onclick=()=>$("side").classList.toggle("open");
$("list").onclick=e=>{if(busy)return;const d=e.target.dataset.del;
  if(d){chats=chats.filter(x=>x.id!==d);if(cur===d)cur=null;store();render();return}
  const ch=e.target.closest(".ch");if(ch){cur=ch.dataset.id;render();$("side").classList.remove("open")}};
$("wrap").onclick=e=>{const s=e.target.dataset.s;if(s){send(s);return}
  const i=e.target.dataset.c;if(i!==undefined){const t=curChat().m[+i].content;try{navigator.clipboard.writeText(t);e.target.textContent="Copied"}catch(x){}}};
render();
</script>
</body>
</html>
